[package]
name = "kanban"
version = "0.4.0-beta.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kanban_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2"
# Google Classroom connector (native auth + network access).
oauth2 = { version = "=5.0.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring"] }
keyring = "=4.2.0"
tokio = { version = "1.53.1", features = ["net", "time", "sync", "macros", "io-util", "rt"] }
url = "2.5.8"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "test-util"] }
wiremock = "=0.6.5"
sha2 = "0.10.9"
base64 = "0.22.1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

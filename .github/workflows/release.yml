name: Publish desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            playwright-report/

  release:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Set numeric MSI version for the beta
        if: env.RELEASE_TAG == 'v0.4.0-beta.1'
        shell: pwsh
        run: |
          '{"bundle":{"windows":{"wix":{"version":"0.4.0.1"}}}}' | Set-Content -Encoding utf8 src-tauri/tauri.windows.conf.json
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Kanban ${{ env.RELEASE_TAG }}
          releaseDraft: true
          # The first beta is a normal Latest release so existing v0.3.0
          # clients using releases/latest/download/latest.json can find it.
          prerelease: ${{ contains(env.RELEASE_TAG, '-') && env.RELEASE_TAG != 'v0.4.0-beta.1' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  publish:
    needs: release
    runs-on: windows-latest
    steps:
      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$RELEASE_TAG" == *-* && "$RELEASE_TAG" != "v0.4.0-beta.1" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --repo "$GITHUB_REPOSITORY"
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --repo "$GITHUB_REPOSITORY"
          fi
